# AOT is switched on by the build (process-aot) or at runtime via spring.aot.enabled=true.
# Repository source generation is on by default when AOT is active; set explicitly for clarity.
spring.aot.repositories.enabled=true

spring.datasource.url=jdbc:h2:mem:demo
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
